name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK 23.2 (Moonlight's native code)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;23.2.8568313" > /dev/null

      - name: Fetch Mercury SDK and Moonlight core
        run: bash scripts/fetch-dependencies.sh

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RayDesk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
